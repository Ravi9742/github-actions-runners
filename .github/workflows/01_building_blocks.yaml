name: 01 - Building Blocks

on: workflow_dispatch

jobs: 
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Say hello, hi
              run: echo "Hello, World!"
    
    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: Success step
              run: |
                echo "This step will pass too"
                exit 0
            - name: Say goodbye, bye
              run: echo "Goodbye, World!"
